name: H3 validation

on:
  push:
    branches:
      - h3-xp-reward-wallet
  workflow_dispatch:

env:
  TZ: America/Phoenix

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc -b
      - run: npx eslint .
      - run: npm run build
