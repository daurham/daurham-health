name: Instance readiness

on:
  push:
    branches:
      - validate-i0-i10

permissions:
  contents: read

jobs:
  instance-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TZ: America/Phoenix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify database configuration
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL repository secret is not configured."
            exit 1
          fi
      - run: npm run instance:check
