name: PIQ isolated PostgreSQL verification
on:
  push:
    branches:
      - piq/00-baseline-20261014
    paths:
      # PIQ candidate's exact SHA must receive both full-app CI and real
      # PostgreSQL 16/18 migrations/recovery CI after ANY source or fixture
      # change on the PIQ integration branch. Narrow per-file allowlists
      # silently missed new modules, Pantry changes and Auth safety tests.
      # Docs-only checkpoints intentionally do not re-run 2 PG service jobs;
      # make the final release candidate a source/CI change when required.
      - '.github/workflows/piq1-postgres.yml'
      - '.github/workflows/validation.yml'
      - 'api/**'
      - 'server/**'
      - 'src/**'
      - 'tests/**'
      - 'migrations/**'
      - 'scripts/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'vite.config.*'
      - 'vitest.config.*'
      - 'tsconfig*.json'
      - 'vercel.json'
  workflow_dispatch:

jobs:
  verify:
    # Persistent isolated QA Neon uses PostgreSQL 18; exercise that major
    # alongside v16 before considering any existing 0057–0060 migrations.
    # Both jobs use independent disposable localhost PostgreSQL fixtures.
    name: verify-pg-${{ matrix.postgres-version }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres-version: ['16', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_USER: piq
          POSTGRES_PASSWORD: piq-fixture-only
          POSTGRES_DB: piq_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U piq -d piq_fixture"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      TZ: America/Phoenix
      PIQ_POSTGRES_URL: postgres://piq:piq-fixture-only@localhost:5432/piq_fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/piq1-nutrition-postgres.integration.test.ts tests/piq1-full-migration-postgres.integration.test.ts tests/piq7-incremental-upgrade-postgres.integration.test.ts tests/piq7-full-recovery-postgres.integration.test.ts
