name: PIQ isolated PostgreSQL verification
on:
  push:
    branches:
      - piq/00-baseline-20261014
    paths:
      # Any new numbered migration or Lab/feedback write must exercise real
      # PostgreSQL. Exact-SHA preview eligibility also requires this workflow.
      - '.github/workflows/piq1-postgres.yml'
      - 'migrations/**'
      - 'server/lab/**'
      - 'server/backup/**'
      - 'server/profile/service.ts'
      - 'server/nutrition/day-completeness.ts'
      - 'server/nutrition/maintenance-eligibility.ts'
      - 'server/weekly-coach/load.ts'
      - 'server/migrate.ts'
      - 'server/migration-history.ts'
      - 'server/migration-preflight.ts'
      - 'src/domain/health-profile.ts'
      - 'src/domain/weekly-coach/build.ts'
      - 'src/domain/nutrition/day-completeness.ts'
      - 'tests/piq1-*.integration.test.ts'
      - 'tests/piq7-incremental-upgrade-postgres.integration.test.ts'
      - 'tests/piq7-full-recovery-postgres.integration.test.ts'
      - 'tests/piq6-finalization-*.test.ts'
      - 'tests/piq6-feedback-source-cas.test.ts'
      # Changes to release qualification itself require a fresh exact-SHA
      # Postgres run, not just a passing full app workflow on an older SHA.
      - 'server/piq-preview-metadata.ts'
      - 'server/piq-postgres-fixture.ts'
      - 'tests/piq7-postgres-fixture-guard.test.ts'
      - 'tests/piq4-preview-metadata.test.ts'
      - 'tests/piq4-neon-root-provenance.test.ts'
      - 'tests/piq7-preview-private-routes.test.ts'
      - 'tests/piq-release-migration-preflight.test.ts'
      - 'tests/piq1-weekly-completeness.test.ts'
      - 'tests/piq1-maintenance-eligibility-baseline.test.ts'
  workflow_dispatch:

jobs:
  verify:
    # Persistent isolated QA Neon uses PostgreSQL 18; exercise that major
    # alongside v16 before considering any existing 0057–0060 migrations.
    # Both jobs use independent disposable localhost PostgreSQL fixtures.
    name: verify-pg-${{ matrix.postgres-version }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres-version: ['16', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_USER: piq
          POSTGRES_PASSWORD: piq-fixture-only
          POSTGRES_DB: piq_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U piq -d piq_fixture"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      TZ: America/Phoenix
      PIQ_POSTGRES_URL: postgres://piq:piq-fixture-only@localhost:5432/piq_fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/piq1-nutrition-postgres.integration.test.ts tests/piq1-full-migration-postgres.integration.test.ts tests/piq7-incremental-upgrade-postgres.integration.test.ts tests/piq7-full-recovery-postgres.integration.test.ts
