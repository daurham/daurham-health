name: V2 H1 Validation

on:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-22.04
    env:
      TZ: America/Phoenix
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc -b
      - run: npx eslint .
      - run: npm run build
