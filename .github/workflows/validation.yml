name: Branch validation

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

env:
  TZ: America/Phoenix

concurrency:
  group: branch-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npx eslint .
      - run: npm test
      - run: npm run build
