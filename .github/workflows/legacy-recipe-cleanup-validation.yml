name: Legacy recipe cleanup validation

on:
  push:
    branches:
      - validate-legacy-recipe-cleanup

env:
  TZ: America/Phoenix

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npx eslint .
      - run: npm test
      - run: npm run build
