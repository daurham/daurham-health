name: Validate H2B
on:
  push:
    branches: [codex/health-h2b-validation]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-22.04
    env:
      TZ: America/Phoenix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y postgresql-14
      - run: npm ci
      - run: npm test
      - run: npx tsc -b
      - run: npx eslint .
      - run: npm run build
