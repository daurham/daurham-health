name: Validate H2D
on:
  push:
    branches: [chatgpt/v2-h2d]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-22.04
    env:
      TZ: America/Phoenix
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y postgresql-14
      - run: npm ci
      - run: npx tsc -b
      - run: npx eslint .
      - run: npm run build
      - run: npm test
