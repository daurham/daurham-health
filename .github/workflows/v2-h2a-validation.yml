name: V2 H2A Validation
# pass 7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2-h2a-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      TZ: America/Phoenix
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npx eslint .
      - run: npm run build
      - run: npm test
