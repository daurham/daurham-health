name: Ask Health validation

on:
  push:
    branches:
      - fix-ask-health-general-synthesis

env:
  TZ: America/Phoenix

concurrency:
  group: ask-health-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npx eslint .
      - run: npm test
      - run: npm run build
