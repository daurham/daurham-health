name: I0B portability audit

on:
  push:
    branches:
      - i0b-instance-identity-timezone
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Find deployment-specific assumptions
        shell: bash
        run: |
          echo '=== TIMEZONE / TODAY ==='
          git grep -n -E 'America/Phoenix|HEALTH_CALENDAR_TIME_ZONE|healthCalendarDateFromNow|SLEEP_TIMEZONE|ACTIVITY_TIMEZONE|INTELLIGENCE_TIMEZONE' -- '*.ts' '*.tsx' '*.md' || true
          echo '=== BRAND / DOMAIN ==='
          git grep -n -E 'health\.daurham\.com|https://daurham\.com|Daurham Health|DaurhamHealth' -- '*.ts' '*.tsx' '*.md' || true
